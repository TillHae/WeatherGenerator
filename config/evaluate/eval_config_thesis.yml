# Evaluation configuration for thesis experiment:
# Baseline (n14mjcpx) vs. Multi-Stage Curriculum (wuxincvz)

evaluation:
  metrics:
    - rmse
    - mae
  summary_plots: true
  ratio_plots: false
  heat_maps: false
  summary_dir: "./plots/"
  plot_ensemble: "members"
  plot_score_maps: false
  plot_score_animations: false
  plot_score_timeseries: true
  print_summary: true
  log_scale: false
  add_grid: false
  score_cards: false
  bar_plots: false

default_streams:
  ERA5:
    regions: ["global"]
    channels: ["2t", "10u", "10v", "z_500", "t_850", "u_850", "v_850"]
    evaluation:
      forecast_step: "all"
      sample: "all"
      ensemble: "all"
    plotting:
      sample: [1, 3]
      forecast_step: [1, 2, 3]
      ensemble: [0]
      plot_maps: true
      plot_bias: false
      plot_target: false
      plot_histograms: false
      plot_animations: false

run_ids:
  n14mjcpx:
    label: "Baseline (direct L6)"
    results_base_dir: "./results/"

  wuxincvz:
    label: "Multi-Stage Curriculum (L3->L6)"
    results_base_dir: "./results/"
