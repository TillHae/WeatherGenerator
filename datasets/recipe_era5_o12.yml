# Anemoi-datasets recipe: ERA5 at O12 (~8°) for WeatherGenerator curriculum L3 training
#
# Creates a lower-resolution version of the existing O96 ERA5 dataset by regridding to O12.
# O12 has ~8° resolution, matching HEALPix level 3 (nside=8, ~7.3°).
#
# Usage (on JUPITER):
#   anemoi-datasets create datasets/recipe_era5_o12.yml \
#     /e/scratch/weatherai/hauer1/era5-o12-1979-2024-6h.zarr

description: ERA5 O12 (~8deg) for WeatherGenerator coarse-to-fine curriculum - L3 stage

dates:
  start: "1979-01-01T00:00:00"
  end: "2024-12-31T18:00:00"
  frequency: 6h

input:
  pipe:
    - anemoi-dataset:
        dataset: /e/data1/slmet/ml_training/aifs-ea-an-oper-0001-mars-o96-1979-2024-1h-v3-with-era51.zarr
    - regrid:
        target_grid: o12

output:
  resolution: o12
  chunking:
    dates: 1
    variables: -1
