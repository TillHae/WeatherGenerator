stages:
  # --- 1. Baseline Run (Level 6) ---
  - name: baselineL6
    stage: train
    config_files:
      - config/config_baseline_L6.yml
    nodes: 1
    slurm_args:
      - "--time=06:00:00"  # ~90 min expected runtime + generous buffer

  # --- 2. Multi-Stage: Level 3 ---
  - name: multistageL3
    stage: train
    config_files:
      - config/config_multistage_L3.yml
    nodes: 1
    slurm_args:
      - "--time=00:30:00"

  # --- 3. Multi-Stage: Level 4 ---
  - name: multistageL4
    stage: train
    from_run_id: STAGE.multistageL3
    config_files:
      - config/config_multistage_L4.yml
    nodes: 1
    slurm_args:
      - "--time=00:45:00"

  # --- 4. Multi-Stage: Level 5 ---
  - name: multistageL5
    stage: train
    from_run_id: STAGE.multistageL4
    config_files:
      - config/config_multistage_L5.yml
    nodes: 1
    slurm_args:
      - "--time=01:45:00"

  # --- 5. Multi-Stage: Level 6 (Target) ---
  - name: multistageL6
    stage: train
    from_run_id: STAGE.multistageL5
    config_files:
      - config/config_multistage_L6.yml
    nodes: 1
    slurm_args:
      - "--time=03:00:00"
